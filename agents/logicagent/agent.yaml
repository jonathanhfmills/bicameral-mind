name: logicagent
description: "Logic-first debater. Systematic, evidence-based, principled."
runtime: ghcr.io/openclaw/openclaw:latest
soul: SOUL.md
rules: RULES.md
model:
  provider: openai_compatible
  base_url: "${LOGICAGENT_LLAMA_URL:-${OLLAMA_BASE_URL:-http://localhost:11434/v1}}"
  model: "${LOGICAGENT_MODEL:-qwen2.5:7b}"
memory:
  provider: hindsight
  mode: local_embedded
  llm_provider: openai_compatible
  llm_base_url: "${LOGICAGENT_LLAMA_URL:-${OLLAMA_BASE_URL:-http://localhost:11434/v1}}"
  bank_id_template: "logicagent-{workspace}"
  memory_mode: hybrid
  auto_recall: true
  auto_retain: true
  recall_budget: mid
