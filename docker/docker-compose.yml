services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    environment:
      - OMC_OPENCLAW=1
      - OPENCLAW_REPLY_CHANNEL=discord
      - OPENCLAW_REPLY_TARGET=${DISCORD_CHANNEL_ID}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - OLLAMA_BASE_URL=http://host.docker.internal:8080/v1
      - NULLCLAW_LLAMA_URL=http://host.docker.internal:8080/v1
      - LOGICAGENT_LLAMA_URL=http://host.docker.internal:8080/v1
      - MAINTAINERAGENT_LLAMA_URL=http://host.docker.internal:8080/v1
      - LUCID_MCP_URL=${LUCID_MCP_URL}
      - KOKORO_URL=http://kokoro-tts:8880/v1
      - FASTER_WHISPER_URL=http://faster-whisper:8000/v1
    volumes:
      - openclaw-config:/home/node/.openclaw
      - ${HOST_DIR:-..}:/host:ro
      - ${HOST_DIR:-..}/debates:/workspace/debates:rw
      - ${HOST_DIR:-..}/agents/nullclaw/memory:/workspace/agents/nullclaw/memory:rw
      - ./agents/logicagent/memory:/workspace/agents/logicagent/memory:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  digital-twin:
    build:
      context: .
      dockerfile: Dockerfile.digital-twin
    environment:
      - ISSUE_URL=${ISSUE_URL:-}
      - OLLAMA_BASE_URL=http://host.docker.internal:8080/v1
      - NULLCLAW_LLAMA_URL=http://host.docker.internal:8080/v1
      - LOGICAGENT_LLAMA_URL=http://host.docker.internal:8080/v1
      - MAINTAINERAGENT_LLAMA_URL=http://host.docker.internal:8080/v1
      - HINDSIGHT_MCP_URL=http://hindsight-mcp:8888
      - LUCID_MCP_URL=http://lucid-mcp:9000
      - DEBATE_TOPIC=${DEBATE_TOPIC:-}
      - MAX_ATTEMPTS=${MAX_ATTEMPTS:-10}
      - HOST_DIR=/workspace
    volumes:
      - ${HOST_DIR:-..}:/workspace:ro
      - ${HOST_DIR:-..}/debates:/workspace/debates:rw
      - ${HOST_DIR:-..}/agents/nullclaw/memory:/workspace/agents/nullclaw/memory:rw
      - ./agents/logicagent/memory:/workspace/agents/logicagent/memory:rw
    depends_on:
      - hindsight-mcp
      - lucid-mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"

  hindsight-mcp:
    image: ghcr.io/vectorize-io/hindsight-api:latest
    environment:
      - HINDSIGHT_API_LLM_PROVIDER=openai
      - HINDSIGHT_API_LLM_BASE_URL=http://host.docker.internal:8080/v1
      - HINDSIGHT_API_LLM_MODEL=${HINDSIGHT_LLM_MODEL:-qwen3.5:0.8b}
      - HINDSIGHT_API_PORT=8888
    volumes:
      - hindsight-data:/root/.pg0
    restart: unless-stopped

  lucid-mcp:
    image: ghcr.io/lucid-memory/lucid:latest
    environment:
      - LUCID_MCP_URL=${LUCID_MCP_URL:-http://localhost:9000}
    restart: unless-stopped

  desktop:
    image: opensandbox/desktop:latest
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:?VNC_PASSWORD required}
      - SANDBOX_DOMAIN=localhost:8080
    ports:
      - "127.0.0.1:5900:5900"
      - "127.0.0.1:6080:6080"

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.2
    ports:
      - "127.0.0.1:8880:8880"
    restart: unless-stopped

  faster-whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - WHISPER__MODEL=large-v3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  hindsight-data:
  openclaw-config:
